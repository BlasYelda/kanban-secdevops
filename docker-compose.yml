services:
  db:
    image: mysql:8.0
    container_name: kanban-db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "--password=${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306" # Solo para que tú puedas ver la DB desde Workbench/DBeaver
    networks:
      - kanban-network

  backend-api:
    build: ./backend
    container_name: kanban-backend
    restart: on-failure
    # 🛡️ Quitamos 'ports' para que solo sea accesible internamente por Nginx/Frontend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - kanban-network

  frontend-flask:
    build: ./frontend
    container_name: kanban-frontend
    # 🛡️ Quitamos 'ports' para forzar el uso de HTTPS vía Nginx
    depends_on:
      - backend-api
    environment:
      - BACKEND_URL=http://kanban-backend:5000
      - SECRET_KEY=${SECRET_KEY}
    networks:
      - kanban-network

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"   # HTTP (Redirigirá a HTTPS)
      - "443:443" # HTTPS (Tráfico Seguro)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend-flask
      - backend-api
    networks:
      - kanban-network

networks:
  kanban-network:
    driver: bridge