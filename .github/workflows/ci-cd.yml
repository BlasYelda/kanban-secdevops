name: CI/CD Pipeline

on:
  push:
    branches: [ main, "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r frontend/requirements.txt
        pip install bandit
        
    - name: Run Bandit (SAST)
      run: |
        # Escaneo de seguridad del código Python
        bandit -r . -f txt --exit-zero

    - name: Validate Nginx Config
      run: |
        # Usamos --add-host para simular que los contenedores existen y Nginx no falle el test
        docker run --rm -t \
          -v ${{ github.workspace }}/nginx/default.conf:/etc/nginx/conf.d/default.conf \
          --add-host kanban-frontend:127.0.0.1 \
          --add-host kanban-backend:127.0.0.1 \
          nginx:alpine nginx -t

    - name: Run Unit Tests
      run: |
        # Ejecuta los tests unitarios
        python -m unittest discover tests

    - name: Build Docker Stack
      run: |
        # Validamos que todos los contenedores (incluido Nginx) construyen correctamente
        docker compose build